apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  template:
    spec:
      # Must exceed quarkus.shutdown.timeout (application.properties, currently 30s)
      # so the kubelet's SIGKILL can never race Quarkus's own drain window during
      # a rolling deploy. Keep this above SHUTDOWN_TIMEOUT + a safety margin.
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification-service
          envFrom:
            - secretRef:
                name: notification-env-secret
          env:
            - name: DB_HOST
              value: "postgres-notification"
            - name: REDIS_HOST
              value: "redis://redis-notification-service:6379"